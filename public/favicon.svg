<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181829" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <!-- Vibrant Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="75%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e45" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#131622" stop-opacity="0.95" />
    </linearGradient>

    <!-- Waveform & Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Ambient Light Reflection -->
  <ellipse cx="256" cy="72" rx="160" ry="48" fill="#818cf8" opacity="0.12" />

  <!-- Inner Caption Card -->
  <rect x="88" y="112" width="336" height="288" rx="64" fill="url(#bubbleGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" filter="url(#softGlow)" />

  <!-- Caption CC Symbol - Left C -->
  <path d="M 216 198 C 216 182 202 170 182 170 C 156 170 140 192 140 226 L 140 286 C 140 320 156 342 182 342 C 202 342 216 330 216 314" 
        fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

  <!-- Caption CC Symbol - Right C -->
  <path d="M 304 198 C 304 182 290 170 270 170 C 244 170 228 192 228 226 L 228 286 C 228 320 244 342 270 342 C 290 342 304 330 304 314" 
        fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

  <!-- Equalizer / Waveform Voice Bars (representing speech-to-captions) -->
  <line x1="338" y1="230" x2="338" y2="282" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
  <line x1="366" y1="202" x2="366" y2="310" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
  <line x1="394" y1="240" x2="394" y2="272" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- Sparkle / Magic Accent on Top Right -->
  <path d="M 390 110 Q 390 135 415 135 Q 390 135 390 160 Q 390 135 365 135 Q 390 135 390 110 Z" fill="#38bdf8" filter="url(#neonGlow)" />
</svg>
